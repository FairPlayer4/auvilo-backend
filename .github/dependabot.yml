# Dependabot schlägt monatlich Updates als Pull Request vor (Anforderung SE3).
# Die CI prüft die PRs (seit 2026-11-23); gemergt wird nur, wenn sie grün ist.
# Ziel ist develop; nach main kommt alles nur über den normalen PR-Weg.
# OpenTofu-Provider fehlen bewusst: Dependabot kennt nur die Terraform-Registry,
# die Lock-Datei nutzt registry.opentofu.org. Provider aktualisieren:
# `tofu init -upgrade` in infra/.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /infra/killswitch
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  # Basis-Images im Dockerfile des Servers (per Digest festgelegt).
  - package-ecosystem: docker
    directory: /server
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]

  # Neue Versionen von connect oder protobuf: auch die Plugin-Versionen in
  # .github/workflows/ci.yml (Job proto) und docs/entwicklungsumgebung.md anheben.
  - package-ecosystem: gomod
    directory: /server
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  # Kotlin-Client: Versionen stehen in client/gradle/libs.versions.toml.
  - package-ecosystem: gradle
    directory: /client
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
