# Prüft Go-Code und OpenTofu-Konfiguration. Braucht keinen Zugang zu GCP.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  killswitch:
    name: Go – Kill-Switch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/killswitch
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # kein GitHub-Token in .git/config für Tests und Werkzeuge
      - uses: actions/setup-go@v6
        with:
          go-version-file: infra/killswitch/go.mod
          cache-dependency-path: infra/killswitch/go.sum
      - name: Formatierung
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      # -race braucht cgo; das gibt es unter Linux ohne Weiteres (lokal unter Windows nicht).
      - name: Tests mit Race-Detector
        run: go test -race -cover ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Version fest wie lokal (docs/entwicklungsumgebung.md), damit neue
          # Linter-Regeln die CI nicht ohne Codeänderung rot machen.
          version: v2.15.0
          working-directory: infra/killswitch
          args: --config ../../.golangci.yml
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  tofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # kein GitHub-Token in .git/config für Tests und Werkzeuge
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
      - name: Formatierung
        run: tofu fmt -check -recursive
      # Ohne Backend: validate prüft nur die Konfiguration, nicht den Zustand in GCP.
      - name: Validieren
        run: tofu init -backend=false -input=false && tofu validate
