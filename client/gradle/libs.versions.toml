# Alle Versionen an einer Stelle; Dependabot schlägt Updates vor.
[versions]
kotlin = "2.4.21"
tink = "1.24.0"
protobuf = "4.36.2"
protobuf-plugin = "0.10.1"
connect = "0.10.0"
okhttp = "5.5.1"
coroutines = "1.11.0"
serialization = "1.13.0"
junit = "6.1.3"

[libraries]
# tink-android statt tink: bringt Protobuf eingebettet mit (kein Konflikt mit
# protobuf-javalite) und ist dieselbe Bibliothek, die später die App nutzt.
tink = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
connect = { module = "com.connectrpc:connect-kotlin", version.ref = "connect" }
connect-okhttp = { module = "com.connectrpc:connect-kotlin-okhttp", version.ref = "connect" }
connect-javalite = { module = "com.connectrpc:connect-kotlin-google-javalite-ext", version.ref = "connect" }
connect-codegen = { module = "com.connectrpc:protoc-gen-connect-kotlin", version.ref = "connect" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
