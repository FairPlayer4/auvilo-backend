syntax = "proto3";

package avlreminder.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.avlreminder.schnittstelle.v1";

// Anmeldung eines Geräts und Verlängerung seiner Sitzung.
// Beide Aufrufe brauchen keine Sitzung (sie stellen eine aus).
//
// Fehlercodes (Connect) und was der Client tun soll:
//   unauthenticated   abgelehnt (Prüfung gescheitert, unbekanntes Gerät, Gerät
//                     eines anderen Kontos). Den Grund nennt der Server bewusst
//                     nicht. Nach abgelehntem Erneuern: neu mit Google anmelden.
//   permission_denied Gerät ist gesperrt – endgültig, auch für Anmelden. Nur
//                     ein neuer Geräteschlüssel ergibt ein neues Gerät.
//   failed_precondition Das Google-Konto ist nicht freigegeben (Freigabeliste,
//                     ID7 in docs/anforderungen.md). Fehlerdetail
//                     NichtFreigegeben mit der Kennung; die App zeigt sie an,
//                     damit der Nutzer sie zum Freischalten weitergeben kann.
//                     Bei SitzungErneuern: Das Konto wurde von der Liste
//                     genommen (gleiches Detail). Neu mit Google anzumelden
//                     hilft dann nicht; erst nach der Freigabe wiederholen.
//   invalid_argument  nur SitzungErneuern: geraet_id ist kein 32-stelliges
//                     Hex oder zeitpunkt fehlt.
//   resource_exhausted Anfrage größer als 64 KiB (gilt für alle Dienste), oder
//                     Tageslimit erreicht: höchstens 200 Sitzungen je Gerät und
//                     Tag (UTC), Anmelden und SitzungErneuern zusammen
//                     ("morgen wieder"; gezählt nur, was die Prüfung besteht).
//                     Anmelden: Das Konto hat schon 10 nicht freigeschaltete,
//                     ungesperrte Geräte (geraete.proto); erst eins freischalten
//                     oder sperren. Ein schon bekanntes Gerät betrifft das nicht.
//   unavailable       vorübergehend; später wiederholen.
//   internal          Fehler im Server.
service AnmeldeDienst {
  // Erstes Anmelden eines Geräts mit einem Google-ID-Token. Legt beim ersten Mal
  // das Konto an. Derselbe Geräteschlüssel ergibt immer dasselbe Gerät.
  rpc Anmelden(AnmeldenRequest) returns (AnmeldenResponse);

  // Neue Sitzung ohne Google-Login: Das Gerät beweist mit einer Signatur seines
  // Geräteschlüssels, dass es das Gerät ist.
  rpc SitzungErneuern(SitzungErneuernRequest) returns (SitzungErneuernResponse);
}

message AnmeldenRequest {
  // ID-Token von Google. Sein Feld "nonce" muss SHA-256 über
  // geraeteschluessel und dahinter nonce_zufall sein (base64url ohne Auffüllung).
  string google_id_token = 1;
  // Öffentlicher Geräteschlüssel: ECDSA P-256, PKIX/DER.
  bytes geraeteschluessel = 2;
  // ECDSA-Signatur (ASN.1/DER, SHA-256; Android: "SHA256withECDSA") über die
  // UTF-8-Bytes von "avlreminder/anmelden/v1\n" + google_id_token.
  bytes signatur = 3;
  // Genau 16 zufällige Bytes, für jede Anmeldung neu. Ohne sie wäre die Nonce
  // für ein Gerät immer gleich, und Google gäbe ein zwischengespeichertes,
  // für den Server zu altes ID-Token zurück. Andere Längen: abgelehnt.
  bytes nonce_zufall = 4;
}

message AnmeldenResponse {
  string konto_id = 1;
  string geraet_id = 2;
  Sitzung sitzung = 3;
  // true, wenn das Konto bei diesem Aufruf angelegt wurde.
  bool neues_konto = 4;
  // true, wenn dieses Gerät freigeschaltet ist (geraete.proto). Ein neues Gerät
  // ist es sofort nur, wenn es im Konto nichts zu schützen gibt.
  bool freigeschaltet = 5;
  // Gesetzt, wenn die Löschung des Kontos beantragt ist: ab dann löscht der
  // Server (konto.proto). Die App zeigt das mit „Abbrechen“ an.
  google.protobuf.Timestamp loeschen_ab = 6;
}

message SitzungErneuernRequest {
  string geraet_id = 1;
  // Uhrzeit des Geräts; darf höchstens 2 Minuten von der des Servers abweichen.
  google.protobuf.Timestamp zeitpunkt = 2;
  // ECDSA-Signatur (ASN.1/DER, SHA-256) über die UTF-8-Bytes von
  // "avlreminder/sitzung/v1\n" + geraet_id + "\n" + zeitpunkt in ganzen
  // Unix-Sekunden als Dezimaltext (z. B. "1793534400").
  bytes signatur = 3;
}

message SitzungErneuernResponse {
  Sitzung sitzung = 1;
  // Gesetzt, wenn die Löschung des Kontos beantragt ist: ab dann löscht der
  // Server (konto.proto). Die App zeigt das mit „Abbrechen“ an.
  google.protobuf.Timestamp loeschen_ab = 2;
}

// Fehlerdetail zu failed_precondition (Anmelden und SitzungErneuern): Das
// Google-Konto steht nicht auf der Freigabeliste des Servers.
message NichtFreigegeben {
  // Kennung des Google-Kontos (64 Zeichen 0-9a-f, HMAC der Google-Konto-ID).
  // Bleibt für ein Google-Konto gleich, auch nach dem Löschen des Kontos;
  // verrät ohne den geheimen Pfeffer des Servers nichts über das Google-Konto.
  string kennung = 1;
}

message Sitzung {
  // Als "Authorization: Bearer <token>" mitschicken. Der Inhalt ist für den
  // Client undurchsichtig (Format kann sich ändern). Gilt 1 Stunde; vor
  // laeuft_ab mit SitzungErneuern eine neue holen.
  string token = 1;
  google.protobuf.Timestamp laeuft_ab = 2;
}
