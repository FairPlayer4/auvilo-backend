syntax = "proto3";

package avlreminder.v1;

option java_multiple_files = true;
option java_package = "com.avlreminder.schnittstelle.v1";

// Ablage für das verschlüsselte Schlüssel-Backup eines Kontos (Etappe B2).
// Alle Aufrufe brauchen eine Sitzung und wirken nur auf das eigene Konto.
//
// Der Server kann das Backup nicht lesen: Es ist mit dem Wiederherstellungs-
// schlüssel verschlüsselt, den nur der Mensch auf Papier hat. Der Server prüft
// nur Größe und Version.
//
// Fehlercodes (Connect):
//   unauthenticated     Sitzung fehlt, ist ungültig oder abgelaufen.
//   permission_denied   Das Gerät ist nicht freigeschaltet (geraete.proto):
//                       BackupLoeschen, BackupSpeichern mit erwartete_version > 0.
//   invalid_argument    BackupSpeichern: chiffrat leer oder größer als 16 KiB,
//                       freischaltschluessel nicht genau 32 Bytes, oder
//                       erwartete_version negativ.
//   failed_precondition BackupSpeichern: erwartete_version passt nicht – ein
//                       anderes Gerät war schneller. Neu holen, nicht überschreiben.
//   not_found           BackupHolen: Für das Konto gibt es noch kein Backup.
//   resource_exhausted  Anfrage größer als 64 KiB.
//   unavailable         vorübergehend; später wiederholen.
//   internal            Fehler im Server.
service SchluesselDienst {
  // Speichert das Backup, aber nur, wenn die gespeicherte Version gleich
  // erwartete_version ist (0 = es gibt noch keins). So überschreibt ein Gerät
  // nie unbemerkt ein neueres Backup.
  rpc BackupSpeichern(BackupSpeichernRequest) returns (BackupSpeichernResponse);

  rpc BackupHolen(BackupHolenRequest) returns (BackupHolenResponse);

  // Löscht das Backup des eigenen Kontos samt Freischaltschlüssel (Neuanfang
  // mit neuen Schlüsseln, DSGVO Art. 17). Gibt es keins, ist das kein Fehler.
  //
  // Grenze: Danach beginnt die Version wieder bei 1. Ein Gerät, das sich noch
  // Version 1 von vorher gemerkt hat, könnte ein neues Backup überschreiben. Clients
  // speichern deshalb nur mit erwartete_version 0 (neu anlegen); wer höhere
  // Versionen nutzen will, braucht vorher einen Grabstein auf dem Server.
  rpc BackupLoeschen(BackupLoeschenRequest) returns (BackupLoeschenResponse);
}

message BackupSpeichernRequest {
  // Verschlüsseltes Backup (Format: proto/avlreminder/inhalt/v1/backup.proto,
  // verschlüsselt im Kotlin-Modul "protokoll"). Höchstens 16 KiB.
  bytes chiffrat = 1;
  // Version, die das Gerät zuletzt gesehen hat; 0, wenn es noch keins gibt.
  int64 erwartete_version = 2;
  // Öffentlicher Ed25519-Schlüssel (32 Bytes), abgeleitet aus dem
  // Wiederherstellungsschlüssel: HKDF-SHA256 (ohne Salz, info
  // "avlreminder/freischaltschluessel/v1") ergibt 32 Bytes, die der Seed des
  // Ed25519-Schlüssels sind. Pflicht. Damit kann sich ein neues Gerät später
  // freischalten (geraete.proto, MitWiederherstellungFreischalten). Aus ihm
  // lässt sich nichts entschlüsseln.
  bytes freischaltschluessel = 3;
}

message BackupSpeichernResponse {
  // Neue Version (erwartete_version + 1).
  int64 version = 1;
}

message BackupHolenRequest {}

message BackupHolenResponse {
  bytes chiffrat = 1;
  int64 version = 2;
}

message BackupLoeschenRequest {}

message BackupLoeschenResponse {}
