# Erzeugt Go-Code für den Server: buf generate (im Ordner proto/).
# Lokal am besten über werkzeuge/buf.sh (buf und Plugins in Docker), sonst mit
# lokal installierten Plugins. Versionen in der CI festgelegt
# (docs/entwicklungsumgebung.md). Der erzeugte Code wird eingecheckt.
version: v2
# clean: Zielordner vorher leeren, damit Code gelöschter .proto-Dateien nicht
# liegen bleibt (sonst merkt die Prüfung in der CI das nicht).
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/FairPlayer4/avlreminder-backend/server/gen
# avlreminder/inhalt: Formate, die nur Clients lesen – der Server bekommt dafür
# keinen Code. Kotlin-Code entsteht im Gradle-Build unter client/.
inputs:
  - directory: .
    exclude_paths:
      - avlreminder/inhalt
plugins:
  - local: protoc-gen-go
    out: ../server/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../server/gen
    opt: paths=source_relative
