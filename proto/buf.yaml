# Schnittstelle zwischen Client und Server (Protobuf, Connect).
# Prüfen: buf lint · Brüche erkennen: buf breaking --against <alter Stand>
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  # Dienste heißen bei uns "…Dienst" statt "…Service" (deutsche Namen).
  service_suffix: Dienst
breaking:
  use:
    - FILE
  # Java-Optionen betreffen nur den erzeugten Code im Repo (client/), nicht
  # das, was über die Leitung geht. Nachgetragen in B2.
  except:
    - FILE_SAME_JAVA_MULTIPLE_FILES
    - FILE_SAME_JAVA_PACKAGE
